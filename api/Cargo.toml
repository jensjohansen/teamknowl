[package]
name = "api"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
async-trait = "0.1.89"
aws-config = "1.8.17"
aws-sdk-s3 = "1.133.0"
aws-smithy-runtime-api = "1.12.1"
aws-smithy-types = "1.4.8"
axum = "0.8.9"
futures-util = "0.3.32"
regex = "1.12.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tantivy = "0.26.1"
tokio = { version = "1.52.3", features = ["full"] }
tower-http = { version = "0.6.11", features = ["cors", "trace"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
